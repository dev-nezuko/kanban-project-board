version: "3.8"

services:
  frontend:
    build: ./mini_trello_fe
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
  backend:
    build: ./mini_trello_be
    command: python manage.py runserver 0.0.0.0:8001
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - dynamodb
  dynamodb:
    image: amazon/dynamodb-local
    ports:
      - "127.0.0.1:8000:8000"
